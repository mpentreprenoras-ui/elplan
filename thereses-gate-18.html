<!doctype html>
<html lang="nb"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<title>Elplan Thereses gate 18</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: drawing sheet in the middle, symbol palette on the left, point editor + summary on the right; stacks to one column on phones. */
:root{
  --bg:#eef0ee; --panel:#ffffff; --ink:#1c2321; --muted:#5d6864; --line:#d5dad7; --soft:#f5f7f5;
  --accent:#1f4fd8; --accent-ink:#ffffff; --brand:#8a6d3b;
  --c-p:#1f4fd8; --c-d:#0f7d78; --c-c:#7046c9; --c-l:#c47a06; --c-o:#4d5a63; --c-ex:#8b9590;
  --ok:#1d7a45; --warn:#b26a00; --bad:#c0362c;
  --sheet:#ffffff;
  --f-ui:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151a19; --panel:#1d2422; --ink:#e7ece9; --muted:#9aa6a1; --line:#2e3835; --soft:#232b29;
  --accent:#7d9bff; --accent-ink:#0e1530; --brand:#c9a96a;
  --ok:#4fbf7d; --warn:#e2a23f; --bad:#ef6a5e; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#151a19; --panel:#1d2422; --ink:#e7ece9; --muted:#9aa6a1; --line:#2e3835; --soft:#232b29;
  --accent:#7d9bff; --accent-ink:#0e1530; --brand:#c9a96a;
  --ok:#4fbf7d; --warn:#e2a23f; --bad:#ef6a5e; color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-ui);font-size:14px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
.brand{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);font-weight:600}
.top h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.top .sub{color:var(--muted);font-size:13px}
.top .sub b{font-family:var(--f-mono);font-weight:500}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:6px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:4px 9px;border:1px solid var(--line);border-radius:99px;background:var(--panel)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.chip.ok i{background:var(--ok)} .chip.warn i{background:var(--warn)}

.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);margin-bottom:12px;font-size:13.5px}
.banner b{font-weight:600}
.banner.locked{border-color:color-mix(in srgb,var(--warn) 55%,var(--line));background:color-mix(in srgb,var(--warn) 10%,var(--panel))}
.banner .dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--ok)}
.banner.locked .dot{background:var(--warn)}

.grid{display:grid;grid-template-columns:210px minmax(0,1fr) 320px;gap:14px;align-items:start}
@media (max-width:1100px){.grid{grid-template-columns:minmax(0,1fr) 300px}.palette{grid-column:1/-1}}
@media (max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.card h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:10px}

.palette .list{display:flex;flex-direction:column;gap:4px}
@media (max-width:1100px){.palette .list{flex-direction:row;overflow-x:auto;padding-bottom:4px}.palette .tool{flex:none}}
.tool{display:flex;align-items:center;gap:9px;border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 8px;text-align:left;font-size:13px;width:100%}
.tool:hover{background:var(--soft)}
.tool[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel))}
.badge{flex:none;display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 4px;border-radius:13px;color:#fff;font-family:var(--f-mono);font-size:10.5px;font-weight:500}
.palette .hint{font-size:12px;color:var(--muted);margin-top:10px}
.tool.sel{font-weight:600}
.tool.sub{padding-left:22px;font-size:12.5px;color:var(--muted)}
.dimrow{display:flex;flex-wrap:wrap;gap:10px}
.dimin{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.dimin span{display:flex;align-items:center;gap:6px;color:var(--ink)}
.dimin input{width:90px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--panel);font-family:var(--f-mono)}
.grp{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 8px 2px}
@media (max-width:1100px){.grp{flex:none;align-self:center;padding:0 4px 0 10px;border-left:1px solid var(--line)}}
.info{display:flex;flex-direction:column;gap:6px;margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--soft);color:var(--ink);font-size:12.5px}
.info b{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.warnbox{margin-top:10px;padding:8px 10px;border-radius:8px;border:1px solid color-mix(in srgb,var(--warn) 55%,var(--line));background:color-mix(in srgb,var(--warn) 10%,var(--panel));font-size:12.5px}
.tag.tl{background:color-mix(in srgb,var(--c-c) 16%,var(--panel));color:var(--c-c)}

.sheetwrap{padding:0;overflow:hidden}
.sheetbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sheetbar .mode{font-size:13px;color:var(--muted)}
.sheetbar .mode b{color:var(--ink)}
.zoom{display:inline-flex;gap:4px}
.zoom button{width:30px;height:30px;border:1px solid var(--line);border-radius:7px;background:var(--panel);font-weight:600}
.scroller{overflow:auto;max-height:72vh;background:var(--soft)}
.paper{position:relative;background:var(--sheet)}
.paper img{display:block;width:100%;height:auto;max-width:none;user-select:none;-webkit-user-drag:none}
.paper svg{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation}
.paper.placing svg{cursor:crosshair}
.pt{cursor:grab;touch-action:none}
.zn{cursor:move;touch-action:none}.zn text{font-family:var(--f-mono);pointer-events:none}.hdl{cursor:nwse-resize}
.paper.placing .zn,.paper.zoning .zn{pointer-events:none}
.paper.zoning svg{touch-action:none;cursor:crosshair}
.pt text{font-family:var(--f-mono);font-weight:500;pointer-events:none}
.legendrow{display:flex;flex-wrap:wrap;gap:6px 14px;padding:9px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.legendrow span{display:inline-flex;align-items:center;gap:6px}
.lg{width:14px;height:14px;border-radius:50%;display:inline-block}

.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.empty{color:var(--muted);font-size:13px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label,.lbl{font-size:12px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--panel);width:100%}
.field textarea{min-height:60px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 10px;font-size:12.5px}
.chips button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px;font-weight:600;font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.meta{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--soft);color:var(--muted)}
.tag.addon{background:color-mix(in srgb,var(--warn) 18%,var(--panel));color:var(--warn)}
.tag.ex{background:var(--soft)}

.counts{display:flex;flex-direction:column}
.counts .r{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.counts .r:last-child{border-bottom:0}
.counts .n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}
.counts .price{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.total{display:flex;justify-content:space-between;padding-top:10px;margin-top:6px;border-top:2px solid var(--ink);font-weight:700}
.total span:last-child{font-family:var(--f-mono)}
.msg{font-size:12.5px;margin-top:8px;color:var(--muted)}
.msg.err{color:var(--bad)} .msg.good{color:var(--ok)}

.mp{border-color:color-mix(in srgb,var(--brand) 45%,var(--line))}
.mp h2{color:var(--brand)}
.mp .sect{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.mp .sect:first-of-type{border-top:0;margin-top:0;padding-top:0}
.ptable{width:100%;border-collapse:collapse;font-size:12.5px}
.ptable td{padding:3px 0}
.ptable input{width:84px;text-align:right;font-family:var(--f-mono);border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--panel)}
.rooms{display:grid;grid-template-columns:42px 1fr;gap:4px 8px;align-items:center;font-size:12.5px}
.rooms code{font-family:var(--f-mono);color:var(--muted)}
.rooms input{border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--panel);width:100%}
.ver{font-size:12.5px;display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto}
.ver div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:5px}
.ver span:last-child{color:var(--muted);text-align:right}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px}
.confirm{border:1px solid var(--bad);border-radius:8px;padding:8px;margin-top:8px;font-size:12.5px}
@media (prefers-reduced-motion:no-preference){.btn,.tool,.chips button{transition:background .12s,border-color .12s}}
.mail{user-select:all;font-family:var(--f-mono);font-weight:500}
</style>

<header class="top">
  <div>
    <div class="brand">MP Renovering · <span data-i="elplan">Elplan</span></div>
    <h1>Thereses gate 18</h1>
    <div class="sub">0452 Oslo · <span data-i="scale">Plantegning fra FINN, mål i cm</span></div>

  if(axis==='h')p.x=ref.side==='l'?p.x-ref.px+px:p.x+ref.px-px;else p.y=ref.side==='t'?p.y-ref.px+px:p.y+ref.px-px;

const CEIL=['spot','tak'];
function neighbours(p){

  let L1=null,R1=null,U1=null,D1=null;
  others.forEach(q=>{const dx=q.x-p.x,dy=q.y-p.y;
    if(Math.abs(dy)<=12){if(dx<0&&(!L1||dx>L1.x-p.x))L1=q;if(dx>0&&(!R1||dx<R1.x-p.x))R1=q}

  [L1,R1].forEach(q=>{if(q)out.push({x1:p.x,y1:p.y,x2:q.x,y2:p.y})});

function dimLine(x1,y1,x2,y2,label,c,fs){
  const horiz=Math.abs(y2-y1)<Math.abs(x2-x1);const mx=(x1+x2)/2,my=(y1+y2)/2;const tk=9;
  const tick=(x,y)=>horiz?`M${x} ${y-tk}V${y+tk}`:`M${x-tk} ${y}H${x+tk}`;
  const w=label.length*fs*0.62+10,h=fs+6;
  return `<path d="M${x1} ${y1}L${x2} ${y2}${tick(x2,y2)}" stroke="${c}" stroke-width="2.5" fill="none"/>`+
    `<rect x="${mx-w/2}" y="${my-h/2}" width="${w}" height="${h}" rx="4" fill="#ffffff" stroke="${c}" stroke-width="1.5"/>`+
    `<text x="${mx}" y="${my}" dy="${fs*0.35}" text-anchor="middle" font-size="${fs}" fill="${c}" font-family="IBM Plex Mono, monospace" font-weight="600">${label}</text>`;
}
function dimsSvg(p,c){

  if(r.h&&r.on!=='h'){const x2=r.h.side==='l'?p.x-r.h.px:p.x+r.h.px;o+=dimLine(p.x+(r.h.side==='l'?-R:R),p.y,x2,p.y,pxCm(r.h.px)+' cm',c,21)}

  neighbours(p).forEach(n=>{const dist=Math.hypot(n.x2-n.x1,n.y2-n.y1);if(dist<2*R+4)return;const sx=Math.sign(n.x2-n.x1),sy=Math.sign(n.y2-n.y1);
    o+=dimLine(n.x1+sx*R,n.y1+sy*R,n.x2-sx*R,n.y2-sy*R,pxCm(dist)+' cm','#0f7d78',19)});

const SPOT_OK=['4'];

/* ---------- persistence ---------- */
function snapshotJSON(){return JSON.stringify({status:st.status,lockDate:st.lockDate,rooms:st.rooms,points:st.points,zones:st.zones,scale:st.scale,versions:st.versions})}
function persist(){
  try{localStorage.setItem(LS_KEY,snapshotJSON())}catch(e){}
  if(!planRef){saveState='local';renderSave();return}
  saveState='saving';renderSave();
  clearTimeout(writeTimer);writeTimer=setTimeout(flush,700);
}
async function flush(){
  if(!planRef)return;
  if(writing){writeTimer=setTimeout(flush,300);return}
  const json=snapshotJSON();if(json===lastWritten){saveState='saved';renderSave();return}
  writing=true;
  try{await planRef.set(JSON.parse(json));lastWritten=json;saveState='saved'}
  catch(e){saveState='offline'}
  writing=false;renderSave();
}
function applyRemote(d){
  if(!d||!Array.isArray(d.points))return;
  const json=JSON.stringify({status:d.status,lockDate:d.lockDate,rooms:d.rooms||{},points:d.points,zones:d.zones||[],scale:d.scale||SCALE0,versions:d.versions||[]});
  if(json===lastWritten||json===snapshotJSON())return;
  if(writeTimer&&saveState==='saving')return; // local edit pending wins
  st={status:d.status||'open',lockDate:d.lockDate||'',rooms:d.rooms||{},points:d.points,zones:d.zones||[],scale:d.scale||SCALE0,versions:d.versions||[]};
  lastWritten=json;
  if(sel&&!st.points.find(p=>p.id===sel)&&!st.zones.find(z=>z.id===sel))sel=null;
  renderAll();
}
let pricesTimer=null;
function persistPrices(){
  try{localStorage.setItem(LS_KEY+'-prices',JSON.stringify(prices))}catch(e){}
  if(!priceRef)return;clearTimeout(pricesTimer);
  pricesTimer=setTimeout(async()=>{try{await priceRef.set({...prices})}catch(e){}},800);
}
function loadLocal(){
  try{const s=localStorage.getItem(LS_KEY);if(s){const d=JSON.parse(s);if(d&&Array.isArray(d.points))st={status:d.status||'open',lockDate:d.lockDate||'',rooms:d.rooms||{},points:d.points,zones:d.zones||[],scale:d.scale||SCALE0,versions:d.versions||[]}}}catch(e){}
  try{const s=localStorage.getItem(LS_KEY+'-prices');if(s)prices={...DEFAULT_PRICES,...JSON.parse(s)}}catch(e){}
  if(prices.led===2800)prices.led=4000;
}
async function connect(){
  if(!window.claude||!window.claude.use)return;
  try{downloads=await window.claude.use('downloads')}catch(e){downloads=null}
  try{db=await window.claude.use('db')}catch(e){db=null}
  if(!db){saveState='local';renderSave();return}
  planRef=db.doc(DOC_PATH);
  try{
    const snap=await planRef.get();
    if(snap.exists){applyRemote(snap.data());saveState='saved'}
    else{lastWritten='';await flush()}
  }catch(e){saveState='offline'}
  renderSave();
  planRef.onSnapshot(s=>{if(s.exists)applyRemote(s.data())},()=>{saveState='offline';renderSave()});
  if(MP){priceRef=db.doc('mp/prices');try{const ps=await priceRef.get();if(ps.exists){prices={...DEFAULT_PRICES,...ps.data()};if(prices.led===2800)prices.led=4000;renderCounts();renderMp()}}catch(e){}}
}

function svgPoint(evt){const svg=$('svg');const pt=svg.createSVGPoint();pt.x=evt.clientX;pt.y=evt.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse())}

$('palette').addEventListener('click',e=>{

  if(k==='__grid'){gridMode=!gridMode;tool=null;sel=null;renderPalette();renderMode();renderPoints();renderEditor();return}
  gridMode=false;
  tool=(k==='__stop'||tool===k)?null:k;calPts=[];renderPalette();renderMode();renderPoints();if(MP)renderMp();
});
let drag=null, suppressClick=false, draw=null, calPts=[];
$('svg').addEventListener('pointerdown',e=>{
  const g=e.target.closest('.pt');
  if(!g){
    if(isZoneTool(tool)){e.preventDefault();const q=svgPoint(e);draw={start:q,cur:q,pid:e.pointerId};$('svg').setPointerCapture(e.pointerId);return}
    if(tool)return;
    const hd=e.target.closest('[data-hdl]'),zg=e.target.closest('.zn');if(!zg)return;
    const z=st.zones.find(q=>q.id===zg.dataset.zid);if(!z)return;
    if(sel!==z.id){sel=z.id;renderPoints();renderEditor()}
    if(!canEdit(z))return;
    e.preventDefault();
    drag={zone:z.id,mode:hd?hd.dataset.hdl:'move',start:svgPoint(e),o:{x:z.x,y:z.y,w:z.w,h:z.h},moved:false,pid:e.pointerId};
    $('svg').setPointerCapture(e.pointerId);return;
  }
  const p=st.points.find(q=>q.id===g.dataset.id);if(!p)return;
  if(gridMode){gridMode=false;renderPalette()}
  sel=p.id;renderPoints();renderEditor();
  if(!canEdit(p)||(p.ex&&!MP))return;
  e.preventDefault();
  drag={id:p.id,start:svgPoint(e),ox:p.x,oy:p.y,moved:false,pid:e.pointerId};
  $('svg').setPointerCapture(e.pointerId);
});
$('svg').addEventListener('pointermove',e=>{
  if(draw&&e.pointerId===draw.pid){draw.cur=svgPoint(e);renderPoints();return}
  if(drag&&drag.zone&&e.pointerId===drag.pid){
    const q=svgPoint(e);const dx=q.x-drag.start.x,dy=q.y-drag.start.y;
    if(!drag.moved&&Math.hypot(dx,dy)<6)return;drag.moved=true;
    const z=st.zones.find(x=>x.id===drag.zone);if(!z)return;const o=drag.o;let x1=o.x,y1=o.y,x2=o.x+o.w,y2=o.y+o.h;
    if(drag.mode==='move'){x1+=dx;x2+=dx;y1+=dy;y2+=dy}
    else{if(drag.mode.includes('w'))x1+=dx;if(drag.mode.includes('e'))x2+=dx;if(drag.mode.includes('n'))y1+=dy;if(drag.mode.includes('s'))y2+=dy}

const PL={'ą':'a','ć':'c','ę':'e','ł':'l','ń':'n','ś':'s','ź':'z','ż':'z','Ą':'A','Ć':'C','Ę':'E','Ł':'L','Ń':'N','Ś':'S','Ź':'Z','Ż':'Z','«':'"','»':'"','“':'"','”':'"','’':"'",'…':'...'};

function planCanvas(list,numbers,zones){
  return new Promise(res=>{
    const img=new Image();img.onload=()=>{

        x.lineWidth=2.5;x.strokeStyle=c;if(z.addon)x.setLineDash([12,7]);x.strokeRect(z.x,z.y,z.w,z.h);x.setLineDash([]);

        const nm=numbers.get(z.id);x.fillText(`${nm?nm+'  ':''}${T[z.t].code} ${fm2(zoneM2(z))} m²`,z.x+z.w/2,z.y+z.h/2)});
      list.forEach(p=>{
        if(!p.ex){const r=dimRefs(p);if(r){x.strokeStyle='#5d6864';x.fillStyle='#5d6864';x.lineWidth=1.5;x.font='600 13px "IBM Plex Mono", monospace';x.textAlign='center';x.textBaseline='middle';
          const lab=(tx,lx,ly)=>{const tw=x.measureText(tx).width+6;x.fillStyle='#fff';x.fillRect(lx-tw/2,ly-8,tw,16);x.fillStyle='#3d4744';x.fillText(tx,lx,ly)};
          if(r.h&&r.on!=='h'){const x2=r.h.side==='l'?p.x-r.h.px:p.x+r.h.px;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(x2,p.y);x.moveTo(x2,p.y-6);x.lineTo(x2,p.y+6);x.stroke();lab(String(pxCm(r.h.px)),(p.x+x2)/2,p.y)}

        if(p.ex&&p.rm){x.strokeStyle='#c0362c';x.lineWidth=5;x.lineCap='round';x.beginPath();x.moveTo(p.x-17,p.y-17);x.lineTo(p.x+17,p.y+17);x.moveTo(p.x+17,p.y-17);x.lineTo(p.x-17,p.y+17);x.stroke()}

        const num=numbers.get(p.id);

async function makePdf(kind,msgEl,ver){

  const cols=withPrice?[{h:'#',w:9},{h:lg==='no'?'Rom':'Room',w:28},{h:'Type',w:50},{h:lg==='no'?'Høyde':'Height',w:28},{h:lg==='no'?'Merknad':'Note',w:47},{h:lg==='no'?'Pris':'Price',w:24}]
                       :[{h:'#',w:9},{h:lg==='no'?'Rom':'Room',w:32},{h:'Type',w:56},{h:lg==='no'?'Høyde':'Height',w:32},{h:lg==='no'?'Merknad':'Note',w:57}];

  head();

  const nw=countsBy(newOnes());
  const nl=newOnes();
  TYPES.forEach(o=>{if(!nw[o.k])return;const of=nl.filter(p=>p.t===o.k);let q=`+${nw[o.k]}  ${o[lg]}`;
    if(o.area)q+=` (${of.reduce((s,p)=>s+(+p.m2||0),0)} m²)`;if(o.k==='led')q+=` (${of.reduce((s,p)=>s+(p.len==null?LED_INC:+p.len),0)} m)`;
    const tlN=of.filter(p=>p.tl).length;if(tlN)q+=` – ${tlN} ${L[lg].tl.toLowerCase()}`;
    doc.text(safe(q),left,y);if(withPrice)doc.text(fmt(of.reduce((s,p)=>s+unitPrice(p),0))+' kr',198,y,{align:'right'});y+=5});
  ['vk','vf'].forEach(k=>{const of=zl.filter(z=>z.t===k);if(!of.length)return;const m=of.reduce((s,z)=>s+zoneM2(z),0);
    doc.text(safe(`${fm2(m)} m²  ${T[k][lg]} (${L[lg].zones(of.length)})`),left,y);if(withPrice)doc.text(fmt(m*(+prices[k]||0))+' kr',198,y,{align:'right'});y+=5});
  const rmN=removedOnes().length;if(rmN){doc.text(safe(`${rmN}  ${L[lg].removed}`),left,y);if(withPrice)doc.text(fmt(rmN*(+prices.rm||0))+' kr',198,y,{align:'right'});y+=5}
  if(withPrice){const tt=priceTotals();y+=2;doc.line(left,y-3,198,y-3);doc.setFont('helvetica','bold');
    doc.text('Sum eks. mva',left,y);doc.text(fmt(tt.sum)+' kr',198,y,{align:'right'});y+=5;doc.setFont('helvetica','normal');
    doc.text('herav tillegg',left,y);doc.text(fmt(tt.add)+' kr',198,y,{align:'right'});y+=5;
    doc.text('inkl. mva 25 %',left,y);doc.text(fmt(tt.sum*1.25)+' kr',198,y,{align:'right'});y+=5;}
  if(withPrice){const w=warnings();if(w.length){y+=3;doc.setFont('helvetica','bold');doc.text('Kontroller kurser, sikringsskap og effektberegning.',left,y);y+=5;doc.setFont('helvetica','normal');
    doc.text(safe(w.join(' · ').replace('nowych punktów','nye punkter').replace('nowy obwód do komfyru','ny kurs til komfyr').replace('ogrzewanie podłogowe','gulvvarme')),left,y);y+=5}}
  if(kind!=='mp'){y+=4;if(y>262){doc.addPage('a4','portrait');y=16}doc.setFont('helvetica','bold');doc.text(safe(L[lg].infoTitle),left,y);y+=5;doc.setFont('helvetica','normal');
    [L[lg].infoSite,L[lg].kitchenInfo,L[lg].badInfo,L[lg].infoCable,L[lg].infoTl,L[lg].infoBad].forEach(s=>{const ls=doc.splitTextToSize(safe(s),186);doc.text(ls,left,y);y+=ls.length*4.2+1.5})}
  if(kind==='client'){y+=4;doc.setTextColor(90);doc.text(safe(lg==='no'?'Pris sendes fra MP Renovering på bakgrunn av denne planen.':'MP Renovering will send a price based on this plan.'),left,y);doc.setTextColor(0)}
  const blob=doc.output('blob');
  const fname=`Elplan_Thereses_gate_18_${kind==='mp'?'MP_kalkyle':kind==='el'?'elektriker':(lg==='no'?'kunde':'client')}${vNum?'_v'+vNum:''}.pdf`;
  if(!downloads){try{const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=fname;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},4000);return true}catch(e){say('PDF error','err');return false}}
  try{await downloads.save({filename:fname,data:blob});say(kind==='mp'?'PDF zapisany.':'PDF OK','good');return true}
  catch(e){if(e&&e.code==='declined'){say('');return false}say((e&&e.message)||'PDF error','err');return false}
}

/* ---------- boot ---------- */
loadLocal();
if(window.matchMedia('(max-width:760px)').matches)zoom=2;
applyZoom();
renderAll();
loadMask();
connect();
})();
</script>
